services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel_bookings_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-hotel_bookings}
      POSTGRES_USER: ${PGUSER:-etl_user}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - "${PGPORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
